name: Momentum Delivery — Backtest

# -----------------------------------------------------------------------
# Daily-signal backtest — mirrors the exact live bot logic.
# Each historical day is scanned: exits are checked first, then entries.
# No calendar forcing — all exits are signal-driven.
#
# Configurable parameters let you tune and compare strategies.
# Results upload as 3 CSV artifacts.
# -----------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: false
        default: "2020-01-01"
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: false
        default: "2024-12-31"
      portfolio_size:
        description: "Max open positions (default 15)"
        required: false
        default: "15"
      capital:
        description: "Initial capital INR (default 1500000)"
        required: false
        default: "1500000"
      hard_stop:
        description: "Hard stop % e.g. 0.08 = 8% (default 0.08)"
        required: false
        default: "0.08"
      profit_target:
        description: "Profit target % e.g. 0.18 = 18% (default 0.18)"
        required: false
        default: "0.18"
      composite_floor:
        description: "Composite exit floor (default 1.5)"
        required: false
        default: "1.5"
      bear_floor:
        description: "Composite floor in bear regime (default 2.5)"
        required: false
        default: "2.5"
      min_hold_days:
        description: "Minimum hold days before soft exits apply (default 7)"
        required: false
        default: "7"
      cooldown_days:
        description: "Re-entry cooldown days after exit (default 15)"
        required: false
        default: "15"
      no_regime_filter:
        description: "Disable regime filter? true/false (default false)"
        required: false
        default: "false"
      regime_ma:
        description: "Regime MA period in days (default 100)"
        required: false
        default: "100"
      trend_roc:
        description: "TREND_BREAK ROC20 threshold % e.g. -3.0 (default -3.0)"
        required: false
        default: "-3.0"
      trend_ma:
        description: "TREND_BREAK vs-50MA threshold % e.g. -3.0 (default -3.0)"
        required: false
        default: "-3.0"

jobs:
  backtest:
    name: Run Daily Backtest
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest
        env:
          STOCKSDEVELOPER_API_KEY: "backtest-mode"
          STOCKSDEVELOPER_ACCOUNT: "backtest-mode"
        run: |
          python backtest.py \
            --start          "${{ github.event.inputs.start_date   || '2020-01-01' }}" \
            --end            "${{ github.event.inputs.end_date     || '2024-12-31' }}" \
            --portfolio-size "${{ github.event.inputs.portfolio_size || '15' }}" \
            --capital        "${{ github.event.inputs.capital       || '1500000' }}" \
            --stop           "${{ github.event.inputs.hard_stop     || '0.08' }}" \
            --target         "${{ github.event.inputs.profit_target || '0.18' }}" \
            --floor          "${{ github.event.inputs.composite_floor || '1.5' }}" \
            --bear-floor     "${{ github.event.inputs.bear_floor      || '2.5' }}" \
            --min-hold       "${{ github.event.inputs.min_hold_days   || '7'   }}" \
            --cooldown       "${{ github.event.inputs.cooldown_days   || '15'  }}" \
            --regime-ma      "${{ github.event.inputs.regime_ma   || '100'  }}" \
            --trend-roc      "${{ github.event.inputs.trend_roc   || '-3.0' }}" \
            --trend-ma       "${{ github.event.inputs.trend_ma    || '-3.0' }}" \
            ${{ github.event.inputs.no_regime_filter == 'true' && '--no-regime-filter' || '' }}

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ github.event.inputs.start_date || '2020' }}-${{ github.event.inputs.end_date || '2024' }}-run${{ github.run_id }}
          path: |
            backtest_results.csv
            backtest_trades.csv
            backtest_performance.csv
          if-no-files-found: warn
