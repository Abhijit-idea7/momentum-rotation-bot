name: Dual Momentum — Weekly Hard Stop Scan

# -----------------------------------------------------------------------
# Circuit breaker between monthly rebalances.
#
# Manual trigger only — run every Friday before 3:30 PM IST.
# GitHub Actions UI: Actions → "Dual Momentum — Weekly Hard Stop Scan" → Run workflow
#
# ONLY purpose: check if any held position is down > 15% from its
# entry price. If yes, fire a CNC SELL order immediately.
#
# Does NOT:
#   - Download or rank the full universe
#   - Open new positions (entries happen at monthly rebalance only)
#   - Exit positions for any reason other than the hard stop
#
# Universe:
#   NIFTY200 — scans positions_nifty200.csv
#   BEES     — scans positions_bees.csv
#   Run separately for each universe you are trading.
#
# Why this matters:
#   Without weekly scans, a stock crashing 30% in one month is only
#   caught at month-end — locking in the full loss.
#   With Friday scans, the stop fires within days of the breach,
#   typically limiting the loss to 15-20%.
# -----------------------------------------------------------------------

on:
  workflow_dispatch:          # Manual trigger only — run every Friday before 3:30 PM IST
    inputs:
      universe:
        description: "Universe to scan: NIFTY200 (stocks) or BEES (ETFs)"
        required: false
        default: "NIFTY200"
      dry_run:
        description: "Dry run? true = preview only, no orders sent (default false)"
        required: false
        default: "false"

jobs:
  weekly-stop-scan:
    name: Weekly Hard Stop Check (${{ github.event.inputs.universe || 'NIFTY200' }})
    runs-on: ubuntu-latest
    permissions:
      contents: write     # needed to git push updated positions/trade log back to repo
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly hard stop scan
        env:
          STOCKSDEVELOPER_API_KEY: ${{ secrets.STOCKSDEVELOPER_API_KEY }}
          STOCKSDEVELOPER_ACCOUNT: ${{ secrets.STOCKSDEVELOPER_ACCOUNT }}
        run: |
          python weekly_scan.py \
            --universe "${{ github.event.inputs.universe || 'NIFTY200' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Commit portfolio changes (only if stops fired, not a dry run)
        if: always() && github.event.inputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add positions_nifty200.csv trade_log_nifty200.csv \
                  positions_bees.csv     trade_log_bees.csv     2>/dev/null || true
          git diff --staged --quiet && \
            echo "No stop-outs this week — portfolio unchanged." || \
            git commit -m "Weekly stop scan $(date -u '+%Y-%m-%d') — ${{ github.event.inputs.universe || 'NIFTY200' }} hard stop exit(s)" && \
            git push
