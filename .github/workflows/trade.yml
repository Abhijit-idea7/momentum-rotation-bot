name: Dual Momentum — Monthly Rebalance

# -----------------------------------------------------------------------
# Run MANUALLY on the LAST TRADING DAY of each month, ~3 PM IST.
# GitHub Actions UI: Actions → "Dual Momentum — Monthly Rebalance" → Run workflow
#
# What it does:
#   1. Downloads 3 years of price history for all Nifty 200 stocks
#   2. Checks absolute momentum: Is Nifty 50's 12M-1M return > 6%?
#      -> NO:  Sells ALL positions (move to cash until next month)
#      -> YES: Ranks stocks by 12M-1M return (Dual Momentum)
#   3. Sells holdings that have dropped below rank 20
#   4. Also sells any position down >15% from entry (hard stop)
#   5. Buys top 15 ranked stocks not already held (fills open slots)
#   6. Fires CNC delivery market orders via stocksdeveloper -> Zerodha
#   7. Commits updated positions.csv and trade_log.csv to the repo
#
# No schedule — fully manual. Run on the last trading day of each month.
# -----------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run? true = preview only, no orders sent (default false)"
        required: false
        default: "false"

jobs:
  monthly-rebalance:
    name: Monthly Rebalance & Trade
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monthly rebalance
        env:
          STOCKSDEVELOPER_API_KEY: ${{ secrets.STOCKSDEVELOPER_API_KEY }}
          STOCKSDEVELOPER_ACCOUNT: ${{ secrets.STOCKSDEVELOPER_ACCOUNT }}
        run: |
          python main.py \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Commit updated portfolio state
        if: always() && github.event.inputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add positions.csv trade_log.csv 2>/dev/null || true
          git diff --staged --quiet && \
            echo "No portfolio changes to commit." || \
            git commit -m "Monthly rebalance $(date -u '+%Y-%m-%d') — dual momentum" && \
            git push
